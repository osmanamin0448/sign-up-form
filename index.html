<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign-up Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="image-container">
      <img class="leave-image" src="./images/leave.avif" alt="">

      <div class="logo-container">
        <img class="logo-image" src="./images/odin-logo.png" alt="odin-logo">
        <h1 class="logo-name">ODIN</h1>
      </div>

      <p class="image-credit">Photo by Halie  West On Unsplash</p>
    </div>

    <div class="info-container">
      <div class="text-info">
        <p>
          This is no real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.
        </p>
        <p>You <em>know</em> you want to</p>
      </div>

      <div class="login-container">
        <h1>Let's do this!</h1>

        <form action="" method="post">
          <div>
            <label for="first-name">First name</label>
            <input type="text" id="first-name" name="first-name">
          </div>

         <div>
            <label for="last-name">Last name</label>            
            <input type="text" id="last-name" name="last-name">  
         </div>
          
          <div>
            <label for="user-email">email</label>            
            <input type="email" id="user-email" name="user-email">
          </div>
          
          <div>
            <label for="phone-number">phone number</label>
            <input type="tel" id="phone-number" name="phone-number">

          </div>

          <div>
            <label for="password">password</label>
            <input type="password" id="password" name="password">
          </div>
          
          <div>
            <label for="confirm-pass">confirm password </label>            
          <input type="password" id="confirm-pass" name="confirm-pass">
          </div>
         
        </form>
      </div>

      <div class="button-container">
        <button type="submit">Create Account</button>
        <p>Already have an account? <strong>Log in</strong></p>
      </div>
    </div>
  </div>
</body>
</html>
